services:
  - type: web
    name: whitebox-omniroute
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_API_KEY
        value: true
      # Set these in Render dashboard — never commit real keys!
      - key: API_KEY_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
